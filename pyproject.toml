[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clapper-ai"
version = "0.1.0"
description = "Render LLM answers on a split-flap display — virtual board first, real hardware later."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pyyaml",
    "pydantic",
]

[project.optional-dependencies]
# The base install runs the full keyless demo. Extras only add real backends.
llm = ["anthropic"]
mic = []         # placeholder: speech-to-text input (later phase)
vestaboard = []  # placeholder: real hardware display (later phase)
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/clapper_ai"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
